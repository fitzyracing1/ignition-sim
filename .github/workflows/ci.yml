name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  fakegreen:
    # Diff scanner from https://github.com/fitzyracing1/fakegreen
    # Primary use: PR base…HEAD. On push to main, only run when HEAD~1 exists.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fakegreen
        uses: fitzyracing1/fakegreen@v0.1.1
        with:
          fail-on: high
